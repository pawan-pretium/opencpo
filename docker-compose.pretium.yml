# Pretium VPS: no host port bindings (Traefik only). Skip simulators.

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  ocpp-core:
    ports: !reset []

  cpo-admin:
    ports: !reset []

  charge-app:
    ports: !reset []

  compliance-tester:
    profiles: ["tools"]
    restart: "no"
    ports: !override
      - "127.0.0.1:8090:8090"

  charger-farm:
    profiles: ["tools"]
    ports: !override
      - "127.0.0.1:8087:8087"
