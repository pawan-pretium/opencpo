# Traefik routing for Pretium OpenCPO exploration.
# DNS needed:
#   cpo.pretiumsynergy.co.uk         -> operator admin
#   app.cpo.pretiumsynergy.co.uk     -> driver PWA (QR links)
#   ocpp.cpo.pretiumsynergy.co.uk    -> OCPP 1.6J WebSocket (charger URL)
#   ocpi.cpo.pretiumsynergy.co.uk    -> OCPI roaming (/ocpi only)
#   billing.cpo.pretiumsynergy.co.uk -> Lago staff UI (Authentik)

services:
  cpo-admin:
    networks:
      - default
      - traefik-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-net
      - traefik.http.routers.pretium-cpo-admin.rule=Host(`cpo.pretiumsynergy.co.uk`)
      - traefik.http.routers.pretium-cpo-admin.entrypoints=websecure
      - traefik.http.routers.pretium-cpo-admin.tls.certresolver=letsencrypt
      # Authentik staff gate (pretium-staff). app.cpo and ocpp.cpo stay open.
      - traefik.http.routers.pretium-cpo-admin.middlewares=authentik-cpo@file
      - traefik.http.services.pretium-cpo-admin.loadbalancer.server.port=8080

  charge-app:
    networks:
      - default
      - traefik-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-net
      - traefik.http.routers.pretium-cpo-app.rule=Host(`app.cpo.pretiumsynergy.co.uk`)
      - traefik.http.routers.pretium-cpo-app.entrypoints=websecure
      - traefik.http.routers.pretium-cpo-app.tls.certresolver=letsencrypt
      - traefik.http.services.pretium-cpo-app.loadbalancer.server.port=8003

  ocpp-core:
    networks:
      - default
      - traefik-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-net
      - traefik.http.routers.pretium-cpo-ocpp.rule=Host(`ocpp.cpo.pretiumsynergy.co.uk`)
      - traefik.http.routers.pretium-cpo-ocpp.entrypoints=websecure
      - traefik.http.routers.pretium-cpo-ocpp.tls.certresolver=letsencrypt
      - traefik.http.services.pretium-cpo-ocpp.loadbalancer.server.port=9100
      - traefik.http.routers.pretium-cpo-ocpp.service=pretium-cpo-ocpp
      # Stripe webhook only. Exact path, no Authentik, no other core API routes.
      - "traefik.http.routers.pretium-cpo-pay.rule=Host(`pay.cpo.pretiumsynergy.co.uk`) && Path(`/api/payments/webhook`)"
      - traefik.http.routers.pretium-cpo-pay.entrypoints=websecure
      - traefik.http.routers.pretium-cpo-pay.tls.certresolver=letsencrypt
      - traefik.http.services.pretium-cpo-pay.loadbalancer.server.port=8000
      - traefik.http.routers.pretium-cpo-pay.service=pretium-cpo-pay
      # OCPI roaming for partners. /ocpi paths only, token-authenticated by the
      # core. No Authentik, no Basic Auth, no management routes on this host.
      - "traefik.http.routers.pretium-cpo-ocpi.rule=Host(`ocpi.cpo.pretiumsynergy.co.uk`) && PathPrefix(`/ocpi`)"
      - traefik.http.routers.pretium-cpo-ocpi.entrypoints=websecure
      - traefik.http.routers.pretium-cpo-ocpi.tls.certresolver=letsencrypt
      - traefik.http.services.pretium-cpo-ocpi.loadbalancer.server.port=8000
      - traefik.http.routers.pretium-cpo-ocpi.service=pretium-cpo-ocpi

  # Lago staff UI + browser API path. Same Authentik gate as cpo.
  # API is not a separate public host; PathPrefix /api on billing.cpo only.
  lago-front:
    networks:
      - default
      - traefik-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-net
      - traefik.http.routers.pretium-cpo-billing.rule=Host(`billing.cpo.pretiumsynergy.co.uk`)
      - traefik.http.routers.pretium-cpo-billing.entrypoints=websecure
      - traefik.http.routers.pretium-cpo-billing.tls.certresolver=letsencrypt
      - traefik.http.routers.pretium-cpo-billing.middlewares=authentik-cpo@file
      - traefik.http.services.pretium-cpo-billing.loadbalancer.server.port=8080

  lago-api:
    networks:
      - default
      - traefik-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-net
      - "traefik.http.routers.pretium-cpo-billing-api.rule=Host(`billing.cpo.pretiumsynergy.co.uk`) && PathPrefix(`/api`)"
      - traefik.http.routers.pretium-cpo-billing-api.entrypoints=websecure
      - traefik.http.routers.pretium-cpo-billing-api.tls.certresolver=letsencrypt
      - traefik.http.routers.pretium-cpo-billing-api.middlewares=authentik-cpo@file
      - traefik.http.routers.pretium-cpo-billing-api.priority=100
      - traefik.http.services.pretium-cpo-billing-api.loadbalancer.server.port=3000
      - traefik.http.routers.pretium-cpo-billing-api.service=pretium-cpo-billing-api
      # The staff UI posts to /graphql on this host. The front container cannot serve it.
      - "traefik.http.routers.pretium-cpo-billing-graphql.rule=Host(`billing.cpo.pretiumsynergy.co.uk`) && PathPrefix(`/graphql`)"
      - traefik.http.routers.pretium-cpo-billing-graphql.entrypoints=websecure
      - traefik.http.routers.pretium-cpo-billing-graphql.tls.certresolver=letsencrypt
      - traefik.http.routers.pretium-cpo-billing-graphql.middlewares=authentik-cpo@file
      - traefik.http.routers.pretium-cpo-billing-graphql.priority=100
      - traefik.http.routers.pretium-cpo-billing-graphql.service=pretium-cpo-billing-api
      - "traefik.http.routers.pretium-cpo-billing-cable.rule=Host(`billing.cpo.pretiumsynergy.co.uk`) && PathPrefix(`/cable`)"
      - traefik.http.routers.pretium-cpo-billing-cable.entrypoints=websecure
      - traefik.http.routers.pretium-cpo-billing-cable.tls.certresolver=letsencrypt
      - traefik.http.routers.pretium-cpo-billing-cable.middlewares=authentik-cpo@file
      - traefik.http.routers.pretium-cpo-billing-cable.priority=100
      - traefik.http.routers.pretium-cpo-billing-cable.service=pretium-cpo-billing-api

networks:
  traefik-net:
    external: true
